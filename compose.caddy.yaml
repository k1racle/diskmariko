name: simple-drive

services:
  filebrowser:
    image: ${FILEBROWSER_IMAGE:-gtstef/filebrowser:stable}
    container_name: simple-drive
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - "${DATA_DIR:-/opt/simple-drive/files}:/srv"
      - "${STATE_DIR:-/opt/simple-drive/state}:/home/filebrowser/database"
      - "./config.yaml:/home/filebrowser/config.yaml:ro"
      - filebrowser_cache:/home/filebrowser/tmp
    networks:
      - drive_internal

  caddy:
    image: caddy:2-alpine
    container_name: simple-drive-proxy
    restart: unless-stopped
    depends_on:
      - filebrowser
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN, for example files.example.com}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - drive_internal

networks:
  drive_internal:
    driver: bridge

volumes:
  filebrowser_cache:
  caddy_data:
  caddy_config:
