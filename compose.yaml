name: simple-drive

services:
  permissions:
    image: ${FILEBROWSER_IMAGE:-gtstef/filebrowser:stable}
    container_name: simple-drive-permissions
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - chown -R 1000:1000 /srv && chmod -R u+rwX /srv
    restart: "no"
    volumes:
      - "${DATA_DIR:-/opt/simple-drive/files}:/srv"

  filebrowser:
    image: ${FILEBROWSER_IMAGE:-gtstef/filebrowser:stable}
    container_name: simple-drive
    restart: unless-stopped
    depends_on:
      permissions:
        condition: service_completed_successfully
    environment:
      FILEBROWSER_DATABASE: /home/filebrowser/data/database.db
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-2340}:80"
    volumes:
      - "${DATA_DIR:-/opt/simple-drive/files}:/srv"
      - filebrowser_state:/home/filebrowser/data

volumes:
  filebrowser_state:
